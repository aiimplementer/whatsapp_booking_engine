<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Slotbook{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f6f4ee'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c8801f'/%3E%3C/svg%3E" />
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="/">
        <span class="brand-mark"></span>
        Slotbook
      </a>
      {% block nav %}
      <nav>
        <a class="nav-secondary" href="/admin/login">Business login</a>
        <a class="btn btn-small" href="/admin/signup">Get started</a>
      </nav>
      {% endblock %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div id="toast-stack"></div>
  <script src="/static/js/api.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
