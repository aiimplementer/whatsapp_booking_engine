<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}ScheduleMate{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/static/img/schedulemate-icon.png" />
  {% block head %}{% endblock %}
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="/" id="brand-home-link">
        <img class="brand-logo" src="/static/img/schedulemate-icon.png" alt="" />
        <span class="brand-word"><span class="brand-word-a">Schedule</span><span class="brand-word-b">Mate</span></span>
      </a>
      {% block nav %}
      <nav>
        <a class="nav-secondary" href="/admin/login">Business login</a>
        <a class="btn btn-small" href="/admin/signup">Get started</a>
      </nav>
      {% endblock %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div id="toast-stack"></div>
  {% block footer %}
  <footer class="site-footer">
    <span class="footer-note">&copy; 2026 ScheduleMate</span>
    <a class="footer-note footer-link" href="/platform-admin/login">Platform admin</a>
    <a class="powered-by" href="https://ai-implementer.netlify.app/" target="_blank" rel="noopener">
      <span>Powered by</span>
      <img src="/static/img/ai-implementer-logo.png" alt="AI Implementer" />
    </a>
  </footer>
  {% endblock %}
  <script src="/static/js/api.js"></script>
  <script>
    (function () {
      var brandLink = document.getElementById('brand-home-link');
      if (brandLink && typeof Api !== 'undefined' && Api.isLoggedIn()) {
        brandLink.href = '/admin';
      }
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
